<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 小鱼交易台</title>
  <script>
    /* 与主站同款：样式生效前同步写好主题，避免闪色 */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) { /* 跟随系统 */ }
    })();
  </script>
  <style>
    :root{
      --d-bg:#0f1216; --d-panel:#171b21; --d-panel2:#1e242c; --d-line:#2a323c;
      --d-fg:#e6e9ee; --d-muted:#93a0b0; --d-crit:#e5534b; --d-accent:#5aa9e6;
      --l-bg:#f4f6f8; --l-panel:#ffffff; --l-panel2:#eef1f5; --l-line:#dde2e8;
      --l-fg:#16202b; --l-muted:#5b6672; --l-crit:#c0392b; --l-accent:#2b6cb0;
      color-scheme:dark;
      --bg:var(--d-bg); --panel:var(--d-panel); --panel2:var(--d-panel2);
      --line:var(--d-line); --fg:var(--d-fg); --muted:var(--d-muted);
      --crit:var(--d-crit); --accent:var(--d-accent);
      --shadow:0 10px 40px rgba(0,0,0,.45);
    }
    @media (prefers-color-scheme: light){
      :root:not([data-theme]){
        color-scheme:light;
        --bg:var(--l-bg); --panel:var(--l-panel); --panel2:var(--l-panel2);
        --line:var(--l-line); --fg:var(--l-fg); --muted:var(--l-muted);
        --crit:var(--l-crit); --accent:var(--l-accent);
        --shadow:0 10px 40px rgba(16,24,40,.12);
      }
    }
    :root[data-theme="light"]{
      color-scheme:light;
      --bg:var(--l-bg); --panel:var(--l-panel); --panel2:var(--l-panel2);
      --line:var(--l-line); --fg:var(--l-fg); --muted:var(--l-muted);
      --crit:var(--l-crit); --accent:var(--l-accent);
      --shadow:0 10px 40px rgba(16,24,40,.12);
    }
    :root[data-theme="dark"]{
      color-scheme:dark;
      --bg:var(--d-bg); --panel:var(--d-panel); --panel2:var(--d-panel2);
      --line:var(--d-line); --fg:var(--d-fg); --muted:var(--d-muted);
      --crit:var(--d-crit); --accent:var(--d-accent);
      --shadow:0 10px 40px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);
      font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      display:flex;align-items:center;justify-content:center;padding:24px;
      position:relative;overflow:hidden}
    /* 背景两团柔光，低调不喧宾 */
    body::before,body::after{content:"";position:absolute;border-radius:50%;
      filter:blur(80px);opacity:.35;pointer-events:none;z-index:0}
    body::before{width:460px;height:460px;top:-160px;left:-120px;
      background:radial-gradient(circle,var(--accent),transparent 70%)}
    body::after{width:420px;height:420px;bottom:-180px;right:-120px;
      background:radial-gradient(circle,#6b7cff,transparent 70%);opacity:.22}

    .card{position:relative;z-index:1;width:100%;max-width:380px;
      background:var(--panel);border:1px solid var(--line);border-radius:16px;
      box-shadow:var(--shadow);padding:34px 30px 28px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
    .logo{width:38px;height:38px;border-radius:10px;flex:none;
      background:linear-gradient(135deg,var(--accent),#6b7cff);
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:19px;font-weight:700;box-shadow:var(--shadow)}
    .brand .t{font-size:16px;font-weight:600}
    .sub{color:var(--muted);font-size:12.5px;margin:2px 0 22px}

    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
    .field{margin-bottom:15px}
    .inp{position:relative}
    input[type=text],input[type=password]{
      width:100%;padding:11px 13px;border-radius:10px;
      border:1px solid var(--line);background:var(--panel2);color:var(--fg);
      font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
    input:focus{border-color:var(--accent);
      box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
    input::placeholder{color:var(--muted);opacity:.7}
    /* 眼睛按钮 */
    .toggle{position:absolute;top:0;right:0;height:100%;width:44px;border:0;
      background:transparent;color:var(--muted);cursor:pointer;font-size:15px;
      display:flex;align-items:center;justify-content:center}
    .toggle:hover{color:var(--fg)}

    button.submit{width:100%;margin-top:6px;padding:11px;border:0;border-radius:10px;
      background:var(--accent);color:#fff;font:inherit;font-weight:600;
      cursor:pointer;transition:filter .15s}
    button.submit:hover{filter:brightness(1.08)}
    button.submit:active{filter:brightness(.95)}

    .err{background:color-mix(in srgb,var(--crit) 14%,transparent);
      border:1px solid color-mix(in srgb,var(--crit) 45%,transparent);
      color:var(--crit);border-radius:10px;padding:9px 12px;font-size:12.5px;
      margin-bottom:16px}
    .foot{margin-top:20px;text-align:center;color:var(--muted);font-size:11.5px}
  </style>
</head>
<body>
  <form class="card" method="post" action="/login" autocomplete="off">
    <div class="brand">
      <div class="logo">鱼</div>
      <div class="t">小鱼交易台</div>
    </div>
    <div class="sub">请登录以访问交易决策与风险数据</div>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next or '/' }}">

    <div class="field">
      <label for="u">用户名</label>
      <input id="u" name="username" type="text" value="{{ username or '' }}"
             autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="p">密码</label>
      <div class="inp">
        <input id="p" name="password" type="password"
               autocomplete="current-password" required>
        <button type="button" class="toggle" aria-label="显示/隐藏密码"
                onclick="var i=document.getElementById('p');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'\u{1F441}':'\u{1F648}'">&#128065;</button>
      </div>
    </div>

    <button class="submit" type="submit">登录</button>
    <div class="foot">会话有效期 120 小时 · 仅本人访问</div>
  </form>
</body>
</html>
