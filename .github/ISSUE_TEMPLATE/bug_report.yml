name: Bug report
description: Report a reproducible defect using synthetic or fully redacted data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, databases, account identifiers, positions, executions, wallet addresses, private hostnames, or raw production logs.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide steps and synthetic inputs only.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment mode
      options:
        - Local Python
        - Docker dashboard only
        - Docker live profile
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all credentials, financial data, wallet identifiers, hostnames, IP addresses, databases, and raw production logs.
          required: true
